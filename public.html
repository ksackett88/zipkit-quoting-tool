<body class="zk-standalone">
<!-- Test page for the customer quoter. In WordPress it is the
     [zipkit_quote_public] shortcode. NOT LIVE: Kelsey approves first.
     Leads only go somewhere when ZK_CONFIG.leadUrl is set; on a local test
     server they go to a local file, everywhere else the form says it isn't
     connected yet. -->
<div class="zk-tool zk-public" data-zk-app="public"></div>
<script>
  window.ZK_CONFIG = { leadUrl: /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '/save/public-lead.json' : '' };
</script>
<script src="js/config.js?v=8"></script>
<script src="js/public.js?v=1"></script>
</body>
