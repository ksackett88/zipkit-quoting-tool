<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Quote · Zip Kit</title>
<link rel="stylesheet" href="css/tool.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand-badge" href="index.html" title="Back to the Sales Portal">
      <img id="brand-logo" src="images/zk-logo.png" alt="Zip Kit Homes">
      <span class="brand-name" id="brand-name">Quoting as Zip Kit Homes</span>
    </a>
    <ol class="steps" id="steps" aria-label="Quote steps"></ol>
    <div class="topbar-right">
      <span id="user-email"></span>
      <a class="link-btn" href="index.html">Portal</a>
    </div>
  </div>
</header>

<main class="page" id="main">
  <div class="empty">Loading the price list…</div>
</main>

<div class="overlay" id="signin" hidden>
  <form class="dialog signin" id="signin-form">
    <h2>Sign in</h2>
    <p>Use your Zip Kit sales account.</p>
    <div class="field"><label for="signin-email">Email</label><input type="email" id="signin-email" autocomplete="email" required></div>
    <div class="field"><label for="signin-password">Password</label><input type="password" id="signin-password" autocomplete="current-password" required></div>
    <div class="notice bad" id="signin-err" hidden></div>
    <button type="submit" class="btn primary" id="signin-btn">Sign in</button>
    <p class="help">Need an account? Ask Kelsey or Sven.</p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/supabase.js?v=7"></script>
<script src="js/pricing.js"></script>
<script src="js/catalog.js"></script>
<script src="js/options.js"></script>
<script src="js/documents.js"></script>
<script src="js/store.js"></script>
<script src="js/flow.js"></script>
</body>
</html>
