<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme host (test)</title>
<!-- A deliberately hostile "WordPress theme" for tests/theme-check.html. It
     styles plain elements the way real themes do (and worse). None of it may
     reach inside the .zk-tool wrapper. The theme loads BEFORE and AFTER the
     tool's stylesheet, to cover both orders. -->
<style id="theme-before">
  html { font-size: 62.5%; }
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.8rem; line-height: 2; color: #333; letter-spacing: .02em; background: #eee; word-spacing: 2px; text-align: justify; }
  *, *::before, *::after { box-sizing: content-box; }
  h1, h2, h3, h4 { font-family: "Times New Roman", serif; text-transform: uppercase; margin: 2em 0 1em; font-weight: 300; letter-spacing: .1em; color: purple; }
  p { margin: 0 0 2em; font-size: 2rem; }
  a { color: green; text-decoration: underline; border-bottom: 2px dotted green; }
  button, input[type=submit], .btn { background: #0073aa; color: #fff; border: 3px solid red; border-radius: 0; padding: 15px 30px; text-transform: uppercase; font-size: 20px; box-shadow: 0 0 10px #000; letter-spacing: 2px; line-height: 3; }
  button:hover, button:focus { background: black; outline: 4px solid orange; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=search], input[type=password], select, textarea {
    border: 2px solid blue; padding: 20px; height: auto; border-radius: 20px; background: #ffd; font-size: 22px; width: 100%; margin-bottom: 30px; box-shadow: inset 0 0 5px red; }
  label { display: block; font-weight: 900; text-transform: uppercase; font-size: 11px; margin-bottom: 1em; }
  ul, ol { margin: 0 0 2em 3em; list-style: square; padding: 1em; }
  li { margin-bottom: 1em; }
  table { border: 3px solid black; margin-bottom: 2em; width: auto; border-collapse: separate; }
  td, th { border: 1px solid #999; padding: 20px; }
  img { max-width: 100%; height: auto; border: 5px solid red; border-radius: 50%; padding: 4px; }
  span { font-style: italic; }
  div { margin-bottom: 0; }
  aside, header, main, section { display: block; padding: 3px; }
  .entry-content ul li { margin-left: 20px; list-style: disc; }
  .entry-content p { margin: 1em 0; }
  .entry-content button { text-decoration: underline; }
  .entry-content input[type=text] { min-height: 60px; }
  .entry-content table td { background: #fee; }
  .entry-content details summary { color: red; }
</style>
<link rel="stylesheet" href="../css/tool.css">
<style id="theme-after">
  button { border-radius: 30px; font-family: Georgia, serif; }
  input, select { font-family: "Courier New", monospace; }
  .entry-content a { font-weight: 900; }
  .entry-content h1 { font-size: 50px; }
  .entry-content div { padding-bottom: 0; }
</style>
</head>
<body class="theme-hostile">
<header style="padding:20px;background:#222;color:#fff">Site header from the theme</header>
<article class="entry-content">
  <p>Some theme page text before the shortcode.</p>
  <div class="zk-tool" data-zk-app="quote"></div>
  <p>Some theme page text after the shortcode.</p>
</article>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script>window.ZK_CONFIG = { base: '../' };</script>
<script src="../js/config.js"></script>
<script src="../lib/supabase.js"></script>
<script src="../js/pricing.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/options.js"></script>
<script src="../js/documents.js"></script>
<script src="../js/store.js"></script>
<script src="../js/legacy-adapter.js"></script>
<script src="../js/schedule.js"></script>
<script src="../js/flow.js"></script>
</body>
</html>
